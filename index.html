<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI短剧全自动生成器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#121212;color:#fff;font-family:system-ui,sans-serif;padding:20px;max-width:750px;margin:0 auto}
    .card{background:#1e1e1e;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
    textarea{width:100%;height:160px;background:#2d2d2d;color:#fff;border:none;border-radius:8px;padding:14px;font-size:14px;resize:vertical}
    button{background:#0071e3;color:#fff;border:none;padding:14px 28px;border-radius:10px;font-size:16px;cursor:pointer;margin-top:12px;transition:background 0.2s}
    button:hover{background:#0077ed}
    .result{background:#2d2d2d;padding:16px;border-radius:8px;margin-top:16px;white-space:pre-wrap;line-height:1.6;min-height:120px}
    h3{margin-bottom:12px;color:#f0f0f0}
  </style>
</head>
<body>
  <h2 style="margin-bottom:20px;text-align:center">AI短剧全自动生成器</h2>

  <div class="card">
    <textarea id="prompt" placeholder="输入你的短剧需求，例如：写一个50秒竖屏赘婿逆袭短剧，严格按镜头+时长+画面+台词格式">写一个50秒竖屏赘婿逆袭短剧，严格格式：
镜头X [时长] | 画面 | 台词
结构：0-3秒钩子 → 3-20秒冲突 → 20-40秒升级 → 40-50秒反转悬念</textarea>
    <br>
    <button onclick="generateAll()">生成剧本 + 视频</button>
  </div>

  <div class="card">
    <h3>生成的剧本</h3>
    <div id="scriptResult" class="result">等待生成...</div>
  </div>

  <div class="card">
    <h3>视频生成结果</h3>
    <div id="videoResult" class="result">视频生成中，约1-3分钟，请耐心等待...</div>
  </div>

  <script>
    async function generateAll() {
      const scriptResult = document.getElementById("scriptResult");
      const videoResult = document.getElementById("videoResult");
      
      scriptResult.textContent = "正在调用DeepSeek生成剧本...";
      videoResult.textContent = "剧本生成后自动调用即梦AI生成视频...";

      try {
        const resp = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: document.getElementById("prompt").value })
        });

        const data = await resp.json();
        scriptResult.textContent = data.script || data.error || "剧本生成失败";
        videoResult.textContent = data.video ? JSON.stringify(data.video, null, 2) : data.error || "视频生成失败";
      } catch (e) {
        scriptResult.textContent = `请求出错：${e.message}`;
        videoResult.textContent = `请求出错：${e.message}`;
      }
    }
  </script>
</body>
</html>
